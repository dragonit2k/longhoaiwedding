<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preview — Thẻ mời & Quà mừng</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Dancing+Script:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>body{background:#e7ddcc} .invite{max-width:480px;margin:0 auto;background:var(--ivory)}</style>
</head>
<body>
<div class="invite">
  <section class="details section">
    <header class="section__head reveal is-visible">
      <span class="pill">Chi tiết thời gian</span>
      <h2 class="display">Trân trọng kính mời</h2>
    </header>
    <div class="events" id="eventsGrid"></div>
  </section>
</div>
<script src="script.js"></script>
<script>
// Ép reveal hiển thị ngay để xem trước
document.addEventListener("DOMContentLoaded",()=>{document.querySelectorAll(".reveal").forEach(el=>el.classList.add("is-visible"));});
</script>
</body>
</html>
